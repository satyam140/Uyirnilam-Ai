<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Farm | Uyirnilam AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/farm.css') }}"></head><body class="farm-page"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">U</span><span>UYIRNILAM <small>AI</small></span></a><nav><a href="/dashboard">Dashboard</a><a href="/weather">Weather</a><a href="/market">Market</a><a class="nav-action" href="/logout">Sign out</a></nav></header><main class="farm-shell"><section class="farm-heading"><p class="eyebrow">My farm</p><h1>{{ farmer.name }}'s<br><em>farm profile.</em></h1><p>Keep the farm details that shape your recommendations in one place.</p></section><form class="farm-form" method="post"><label for="farm_name">Farm name</label><input id="farm_name" name="farm_name" value="{{ farm.farm_name }}" required><label for="location">Location</label><input id="location" name="location" value="{{ farm.location }}" required><div class="form-row"><div><label for="area">Area</label><input id="area" name="area" value="{{ farm.area }}" required></div><div><label for="crop">Main crop</label><input id="crop" name="crop" value="{{ farm.crop }}" required></div></div><label for="soil_type">Soil type</label><input id="soil_type" name="soil_type" value="{{ farm.soil_type }}" required><button class="button button-primary" type="submit">Save farm details <span aria-hidden="true">↗</span></button>{% if saved %}<p class="saved-message" role="status">Your farm details are saved.</p>{% endif %}</form></main></body></html>
